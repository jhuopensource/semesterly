services:
  db:
    image: postgres:12.1
    ports:
      - "5432:5432"
  web:
    image: semesterly
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
    build: .
    command: bash -c "python3 manage.py migrate; yarn watch & python3 /code/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      - db
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://web:8000/health/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s # Wait for 3 minutes for the container to start
  localssl:
    image: jhuopensource/semesterly-caddy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./build/caddy/Caddyfile:/etc/Caddyfile
    ports:
      - "443:443"
    depends_on:
      - web
