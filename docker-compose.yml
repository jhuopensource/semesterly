services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: semesterly
    container_name: semesterly-web
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    build: .
    command: bash -c "python3 manage.py migrate; yarn watch & python3 -m uvicorn semesterly.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - .:/code
      - /code/node_modules
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  localssl:
    image: jhuopensource/semesterly-caddy
    container_name: semesterly-localssl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./build/caddy/Caddyfile:/etc/Caddyfile
    ports:
      - "443:443"
    depends_on:
      - web