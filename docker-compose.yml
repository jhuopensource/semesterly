version: "3"

services:
  db:
    image: postgres:12.1
    ports:
      - "5432:5432"
  web:
    image: semesterly
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=0
    build: .
    command: bash -c "python manage.py migrate; npm run watch & python /code/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - /code/node_modules # Use local node_modules from image
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://web:8000/health/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  localssl:
    image: jhuopensource/semesterly-caddy
    logging:
      driver: none
    volumes:
      - ./build/caddy/Caddyfile:/etc/Caddyfile
    ports:
      - "443:443"
    depends_on:
      - web
